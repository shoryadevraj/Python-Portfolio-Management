<!DOCTYPE html>
<html>
<head>
    <title>Create Portfolio</title>
</head>

<body>

<h1>Create Portfolio</h1>

<form method="POST">

<input type="text" name="designation"><br><br>

<textarea name="skills"></textarea><br><br>

</form>

</body>
</html>
